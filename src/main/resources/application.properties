spring.application.name=Cashi
server.port=${PORT:8080}

# Load local secrets from a git-ignored .env file in the working directory (optional, so prod/CI can use real env vars)
spring.config.import=optional:file:.env[.properties]

# JWT Configuration
# Base64 HMAC key (at least 256 bits). Generate with: openssl rand -base64 32
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:900000}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Firebase / Firestore
# The service account key lives outside the repo; never commit it.
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:${user.home}/.config/cashi-api/firebase-service-account.json}
firebase.project-id=${FIREBASE_PROJECT_ID:cashi-payment-cbb9a}
